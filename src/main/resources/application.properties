spring.application.name=productos-postgresql
server.port=8080

# Datos de conexión. Puedes sobrescribirlos con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda_ropa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Permite que Spring Boot arranque aunque PostgreSQL no esté disponible.
# Así, CommandLineRunner puede capturar e imprimir el error de conexión.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# La tabla se crea mediante el script SQL, no desde Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
